services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resumeai-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - NODE_ENV=production
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL}
      - GEMINI_MODEL_FALLBACKS=${GEMINI_MODEL_FALLBACKS}
      - GEMINI_TLS_INSECURE=${GEMINI_TLS_INSECURE}
    env_file:
      - .env
